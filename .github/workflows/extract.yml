name: Extract skills

# Once a day, extract the Assistant skills from the live Studio release and
# commit them when they changed. Can also be started by hand.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  LUNE_VERSION: 0.11.1

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Lune
        run: |
          curl -fsSL -o lune.zip "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip"
          unzip -q lune.zip -d "$RUNNER_TEMP/lune"
          rm lune.zip
          echo "$RUNNER_TEMP/lune" >> "$GITHUB_PATH"

      - run: lune run tools/extract.luau

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- skills)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add -- skills
          git commit -m "Skills from Studio $(cut -d' ' -f1 skills/STUDIO_VERSION)"
          git push
